<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Lluvia de Estrellas</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; -webkit-user-select: none; user-select: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const c = document.getElementById('c');
  const x = c.getContext('2d');
  let W, H, DPR, U;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const mk = (w, h) => { const e = document.createElement('canvas'); e.width = Math.max(1, Math.floor(w)); e.height = Math.max(1, Math.floor(h)); return e; };
  function soft(r, g, b) {
    const s = mk(128, 128), q = s.getContext('2d');
    const gr = q.createRadialGradient(64, 64, 0, 64, 64, 64);
    gr.addColorStop(0, `rgba(${r},${g},${b},1)`); gr.addColorStop(0.35, `rgba(${r},${g},${b},0.4)`); gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
    q.fillStyle = gr; q.fillRect(0, 0, 128, 128); return s;
  }
  const sprGold = soft(255, 210, 90), sprRed = soft(255, 70, 110), sprCyan = soft(100, 220, 255), sprPink = soft(255, 120, 200), sprWhite = soft(255, 255, 255);
  const HALOS = [sprGold, sprPink, sprCyan, sprWhite];

  /* ---------- Estado ---------- */
  let state = 'menu', T = 0, playT = 0, score = 0, best = 0, lives = 3, streak = 0, mult = 1;
  let shake = 0, flash = 0, inv = 0, magT = 0, slowT = 0, glow = 0, overT = 0, spawnT = 1, comboPulse = 0, newRecord = false;
  try { best = +localStorage.getItem('estrellas_best') || 0; } catch (e) {}
  let items = [], parts = [], pops = [], trail = [], bgStars = [];
  let pl = { x: 0, y: 0, r: 0 }, tgx = 0, tgy = 0;
  let bgC, b1, b2, b1c, b2c;

  /* ---------- Sonido ---------- */
  let ac = null, mg = null;
  function initAudio() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); mg = ac.createGain(); mg.gain.value = 0.5; mg.connect(ac.destination); } catch (e) { ac = null; }
  }
  function tone(f, d, type, v, slide, delay) {
    if (!ac) return;
    const t = ac.currentTime + (delay || 0), o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(mg); o.start(t); o.stop(t + d + 0.02);
  }
  const SC = [0, 2, 4, 7, 9];
  function noteSound(n) {
    const semis = SC[n % 5] + 12 * Math.floor((n % 15) / 5), f = 261.63 * Math.pow(2, semis / 12);
    tone(f, 0.28, 'sine', 0.2); tone(f * 2, 0.16, 'triangle', 0.06);
  }
  const sndHit = () => { tone(120, 0.4, 'sawtooth', 0.22, 40); tone(70, 0.5, 'square', 0.1, 30); };
  const sndPower = () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.18, 'triangle', 0.14, 0, i * 0.06)); };
  const sndHeart = () => { tone(660, 0.15, 'sine', 0.18); tone(880, 0.25, 'sine', 0.18, 0, 0.1); };
  const sndOver = () => { [392, 330, 262, 196].forEach((f, i) => tone(f, 0.35, 'triangle', 0.18, 0, i * 0.18)); };

  /* ---------- Efectos ---------- */
  function burst(bx, by, spr, n, sp) {
    for (let i = 0; i < n; i++) {
      const a = rnd(0, 6.28), v = rnd(0.3, 1) * sp;
      parts.push({ x: bx, y: by, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0, max: rnd(0.5, 1.1), r: rnd(0.6, 1.6) * U, spr });
    }
  }
  const pop = (px, py, txt, col) => pops.push({ x: px, y: py, txt, col, t: 0 });

  /* ---------- Juego ---------- */
  const diff = () => clamp(playT / 100, 0, 1);
  function startGame() {
    state = 'play'; playT = 0; score = 0; lives = 3; streak = 0; mult = 1; items = []; parts = []; pops = [];
    magT = 0; slowT = 0; inv = 0; spawnT = 0.6; newRecord = false; flash = 0; shake = 0;
  }
  function endGame() {
    state = 'over'; overT = 0; sndOver();
    if (score > best) { best = score; newRecord = true; try { localStorage.setItem('estrellas_best', String(best)); } catch (e) {} }
  }
  function spawn() {
    const d = diff(), r = Math.random();
    let type;
    if (state === 'menu') type = 'star';
    else if (r < 0.035) type = 'mag';
    else if (r < 0.065) type = 'slow';
    else if (r < 0.085 && lives < 3) type = 'heart';
    else type = Math.random() < 0.22 + 0.18 * d ? 'rock' : 'star';
    const rad = type === 'rock' ? rnd(2.4, 4) * U : 2 * U;
    const it = { type, x: rnd(rad + 2 * U, W - rad - 2 * U), y: -rad * 2, vy: H * (0.20 + 0.18 * d) * rnd(0.85, 1.2), vx: type === 'rock' ? rnd(-2, 2) * U : 0, rot: rnd(0, 6.28), vr: rnd(-2, 2), r: rad, ph: rnd(0, 6.28), shape: [] };
    if (type === 'rock') for (let i = 0; i < 9; i++) it.shape.push(rnd(0.75, 1.2));
    items.push(it);
  }

  function update(dt) {
    pl.x += (tgx - pl.x) * Math.min(1, dt * 14); pl.y += (tgy - pl.y) * Math.min(1, dt * 14);
    pl.x = clamp(pl.x, pl.r, W - pl.r); pl.y = clamp(pl.y, pl.r + 8 * U, H - pl.r);
    trail.push({ x: pl.x, y: pl.y }); if (trail.length > 38) trail.shift();

    const ts = slowT > 0 ? 0.5 : 1;
    if (state === 'play') {
      playT += dt; inv = Math.max(0, inv - dt); magT = Math.max(0, magT - dt); slowT = Math.max(0, slowT - dt);
    } else if (state === 'over') overT += dt;
    glow += ((state === 'play' ? (mult - 1) / 7 : 0.15) - glow) * Math.min(1, dt * 2);
    shake = Math.max(0, shake - dt * 1.6); flash = Math.max(0, flash - dt * 2.2); comboPulse = Math.max(0, comboPulse - dt * 3);

    if (state !== 'over') {
      spawnT -= dt;
      if (spawnT <= 0) { spawnT = (state === 'menu' ? 0.9 : (0.75 - 0.43 * diff())) * rnd(0.8, 1.2); spawn(); }
    }

    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      if (magT > 0 && state === 'play' && (it.type === 'star')) {
        const dx = pl.x - it.x, dy = pl.y - it.y;
        if (Math.hypot(dx, dy) < 16 * U) { it.x += dx * 5 * dt; it.y += dy * 5 * dt; }
      }
      it.y += it.vy * ts * dt; it.x += it.vx * ts * dt; it.rot += it.vr * dt;
      if (it.x < it.r) { it.x = it.r; it.vx = Math.abs(it.vx); } if (it.x > W - it.r) { it.x = W - it.r; it.vx = -Math.abs(it.vx); }
      if (state !== 'over') {
        const d = Math.hypot(it.x - pl.x, it.y - pl.y), hit = it.type === 'rock' ? it.r * 0.8 : it.r * 1.3;
        if (d < pl.r + hit) {
          items.splice(i, 1);
          if (it.type === 'star') {
            if (state === 'play') {
              const gain = 10 * mult; score += gain; streak++;
              const nm = Math.min(8, 1 + Math.floor(streak / 5)); if (nm > mult) comboPulse = 1; mult = nm;
              pop(it.x, it.y - 2 * U, '+' + gain, '#ffe27a'); noteSound(streak - 1);
            } else noteSound(Math.floor(rnd(0, 8)));
            burst(it.x, it.y, sprGold, 14, 30 * U);
          } else if (it.type === 'rock') {
            if (inv <= 0) {
              lives--; streak = 0; mult = 1; shake = 0.6; flash = 1; inv = 1.4; sndHit();
              burst(it.x, it.y, sprRed, 26, 38 * U);
              if (lives <= 0) endGame();
            }
          } else if (it.type === 'mag') { magT = 6; sndPower(); burst(it.x, it.y, sprCyan, 20, 30 * U); pop(it.x, it.y - 2 * U, '¡Imán!', '#8fe9ff'); }
          else if (it.type === 'slow') { slowT = 5; sndPower(); burst(it.x, it.y, sprPink, 20, 30 * U); pop(it.x, it.y - 2 * U, '¡Tiempo lento!', '#ff9ad8'); }
          else if (it.type === 'heart') { lives = Math.min(5, lives + 1); sndHeart(); burst(it.x, it.y, sprPink, 20, 30 * U); pop(it.x, it.y - 2 * U, '+1 vida', '#ff8aa8'); }
          continue;
        }
      }
      if (it.y > H + it.r * 2) {
        if (it.type === 'star' && state === 'play' && streak > 0) { streak = 0; mult = 1; }
        items.splice(i, 1);
      }
    }
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i]; p.life += dt;
      if (p.life >= p.max) { parts.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt; const k = Math.pow(0.96, dt * 60); p.vx *= k; p.vy *= k;
    }
    for (let i = pops.length - 1; i >= 0; i--) { pops[i].t += dt; if (pops[i].t > 1) pops.splice(i, 1); }
    for (const s of bgStars) { s.y += (2 + 9 * s.z) * U * dt * (slowT > 0 ? 0.5 : 1); if (s.y > H) { s.y = -2; s.x = rnd(0, W); } }
  }

  /* ---------- Dibujo ---------- */
  function starPath(r) {
    x.beginPath();
    for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r; i ? x.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : x.moveTo(Math.cos(a) * rr, Math.sin(a) * rr); }
    x.closePath();
  }
  function heartPath(s) {
    x.beginPath(); x.moveTo(0, s * 0.35);
    x.bezierCurveTo(-s * 1.1, -s * 0.3, -s * 0.6, -s * 1.0, 0, -s * 0.4);
    x.bezierCurveTo(s * 0.6, -s * 1.0, s * 1.1, -s * 0.3, 0, s * 0.35); x.closePath();
  }
  function glowText(txt, tx_, ty_, size, col, gcol, align) {
    x.font = `800 ${size}px system-ui, -apple-system, "Segoe UI", sans-serif`; x.textAlign = align || 'center'; x.textBaseline = 'middle';
    x.shadowColor = gcol; x.shadowBlur = size * 0.6; x.fillStyle = col; x.fillText(txt, tx_, ty_); x.shadowBlur = 0;
  }

  function drawScene() {
    // fondo vivo
    for (const s of bgStars) {
      const tw = 0.5 + 0.5 * Math.sin(T * s.tw + s.ph);
      x.globalAlpha = (0.25 + 0.6 * s.z) * (0.5 + 0.5 * tw); x.fillStyle = s.warm ? '#ffe9b8' : '#cfe6ff';
      x.fillRect(s.x, s.y, s.s, s.s);
    }
    x.globalAlpha = 1; x.globalCompositeOperation = 'lighter';
    const ac_ = [[80, 255, 170], [60, 200, 255], [170, 110, 255]];
    for (let b = 0; b < 3; b++) {
      const base = H * (0.12 + 0.05 * b), amp = H * 0.05, al = 0.04 + 0.16 * glow;
      const [r, gg, bb] = ac_[b];
      const gr = x.createLinearGradient(0, base - amp, 0, base + H * 0.22);
      gr.addColorStop(0, `rgba(${r},${gg},${bb},${al})`); gr.addColorStop(1, `rgba(${r},${gg},${bb},0)`);
      x.fillStyle = gr; x.beginPath();
      for (let px = 0; px <= W + 24; px += 24) { const y = base + Math.sin(px * 0.004 + T * 0.3 + b * 2) * amp + Math.sin(px * 0.011 - T * 0.5 + b) * amp * 0.3; px ? x.lineTo(px, y) : x.moveTo(px, y); }
      x.lineTo(W + 24, base + H * 0.22); x.lineTo(0, base + H * 0.22); x.closePath(); x.fill();
    }

    // objetos
    for (const it of items) {
      x.save(); x.translate(it.x, it.y); x.rotate(it.rot);
      const r = it.r;
      if (it.type === 'star') {
        const pu = 1 + 0.08 * Math.sin(T * 5 + it.ph);
        x.globalAlpha = 0.65; x.drawImage(sprGold, -r * 3.2, -r * 3.2, r * 6.4, r * 6.4); x.globalAlpha = 1;
        starPath(r * pu); x.fillStyle = '#ffe27a'; x.fill(); x.lineWidth = 1.5 * DPR; x.strokeStyle = '#fff6c8'; x.stroke();
      } else if (it.type === 'rock') {
        x.globalAlpha = 0.4; x.drawImage(sprRed, -r * 2.6, -r * 2.6, r * 5.2, r * 5.2); x.globalAlpha = 1;
        x.globalCompositeOperation = 'source-over';
        x.beginPath();
        for (let i = 0; i < 9; i++) { const a = i / 9 * 6.2832, rr = r * it.shape[i]; i ? x.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : x.moveTo(Math.cos(a) * rr, Math.sin(a) * rr); }
        x.closePath();
        const rg = x.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r * 1.2); rg.addColorStop(0, '#4a1a52'); rg.addColorStop(1, '#14061c');
        x.fillStyle = rg; x.fill(); x.lineWidth = 2.2 * DPR; x.strokeStyle = 'rgba(255,70,120,0.95)'; x.stroke();
        x.globalCompositeOperation = 'lighter';
      } else {
        const spr = it.type === 'mag' ? sprCyan : sprPink;
        x.rotate(-it.rot); const pu = 1 + 0.1 * Math.sin(T * 4 + it.ph);
        x.globalAlpha = 0.7; x.drawImage(spr, -r * 3, -r * 3, r * 6, r * 6); x.globalAlpha = 1;
        if (it.type === 'heart') { heartPath(r * 1.1 * pu); x.fillStyle = '#ff6f94'; x.fill(); x.lineWidth = 1.5 * DPR; x.strokeStyle = '#ffd0dc'; x.stroke(); }
        else {
          x.beginPath(); x.arc(0, 0, r * pu, 0, 6.2832); x.fillStyle = it.type === 'mag' ? 'rgba(120,230,255,0.85)' : 'rgba(255,140,210,0.85)'; x.fill();
          x.lineWidth = 1.8 * DPR; x.strokeStyle = '#fff'; x.stroke();
          x.lineCap = 'round'; x.lineWidth = r * 0.22; x.beginPath();
          if (it.type === 'mag') { x.arc(0, 0, r * 0.4, 0, Math.PI); x.moveTo(-r * 0.4, 0); x.lineTo(-r * 0.4, -r * 0.45); x.moveTo(r * 0.4, 0); x.lineTo(r * 0.4, -r * 0.45); }
          else { x.arc(0, 0, r * 0.5, 0, 6.2832); x.moveTo(0, 0); x.lineTo(0, -r * 0.35); x.moveTo(0, 0); x.lineTo(r * 0.28, r * 0.12); }
          x.stroke();
        }
      }
      x.restore();
    }

    // estela del jugador
    x.lineCap = 'round';
    for (let i = 1; i < trail.length; i++) {
      const a = trail[i - 1], b = trail[i], t = i / trail.length;
      x.strokeStyle = `hsla(${(T * 70 + i * 5) % 360},95%,${60 + t * 20}%,${t * 0.8})`; x.lineWidth = pl.r * 2 * t;
      x.beginPath(); x.moveTo(a.x, a.y); x.lineTo(b.x, b.y); x.stroke();
    }
    // jugador
    if (!(inv > 0 && Math.floor(T * 14) % 2)) {
      const h = HALOS[Math.floor(T * 1.5) % HALOS.length];
      x.globalAlpha = 0.7; x.drawImage(h, pl.x - pl.r * 4, pl.y - pl.r * 4, pl.r * 8, pl.r * 8); x.globalAlpha = 1;
      x.beginPath(); x.arc(pl.x, pl.y, pl.r, 0, 6.2832); x.fillStyle = '#fff'; x.fill();
    }
    if (magT > 0 && state === 'play') {
      x.setLineDash([6 * DPR, 8 * DPR]); x.lineDashOffset = -T * 30; x.lineWidth = 1.5 * DPR; x.strokeStyle = `rgba(140,230,255,${0.25 + 0.15 * Math.sin(T * 6)})`;
      x.beginPath(); x.arc(pl.x, pl.y, 16 * U, 0, 6.2832); x.stroke(); x.setLineDash([]);
    }
    // partículas
    for (const p of parts) {
      const a = 1 - p.life / p.max, rr = p.r * (0.5 + a) * 2.5;
      x.globalAlpha = a * a; x.drawImage(p.spr, p.x - rr, p.y - rr, rr * 2, rr * 2);
    }
    x.globalAlpha = 1; x.globalCompositeOperation = 'source-over';
    for (const p of pops) {
      const a = 1 - p.t; x.globalAlpha = a;
      glowText(p.txt, p.x, p.y - p.t * 6 * U, 3 * U, p.col, p.col);
    }
    x.globalAlpha = 1;
  }

  function bloom() {
    b1c.globalCompositeOperation = 'source-over'; b1c.drawImage(c, 0, 0, b1.width, b1.height);
    b1c.globalCompositeOperation = 'multiply'; b1c.drawImage(b1, 0, 0);
    b2c.drawImage(b1, 0, 0, b2.width, b2.height);
    x.globalCompositeOperation = 'lighter';
    x.globalAlpha = 0.8; x.drawImage(b1, 0, 0, W, H); x.globalAlpha = 0.9; x.drawImage(b2, 0, 0, W, H);
    x.globalAlpha = 1; x.globalCompositeOperation = 'source-over';
  }

  function drawHUD() {
    if (state === 'play') {
      x.textBaseline = 'alphabetic'; x.textAlign = 'left'; x.fillStyle = 'rgba(200,220,255,0.6)'; x.font = `700 ${2 * U}px system-ui, sans-serif`;
      x.fillText('PUNTOS', 4 * U, 5.5 * U);
      glowText(String(score), 4 * U, 10 * U, 4.2 * U, '#fff', '#8fb8ff', 'left');
      x.textAlign = 'right'; x.fillStyle = 'rgba(200,220,255,0.6)'; x.font = `700 ${2 * U}px system-ui, sans-serif`; x.fillText('RÉCORD', W - 4 * U, 5.5 * U);
      glowText(String(Math.max(best, score)), W - 4 * U, 10 * U, 3.4 * U, '#ffe27a', '#ffb347', 'right');
      for (let i = 0; i < lives; i++) { x.save(); x.translate(5.5 * U + i * 3.6 * U, 15.5 * U); heartPath(1.4 * U); x.fillStyle = '#ff6f94'; x.shadowColor = '#ff3d6e'; x.shadowBlur = 8 * DPR; x.fill(); x.restore(); }
      if (mult > 1) {
        const s = 1 + comboPulse * 0.5; x.save(); x.translate(W / 2, 11 * U); x.scale(s, s);
        glowText('x' + mult, 0, 0, 6 * U, '#ffe27a', '#ff9d3d'); x.restore();
      }
      let by = H - 5 * U;
      for (const [t, name, col, tot] of [[magT, 'Imán', '#8fe9ff', 6], [slowT, 'Tiempo lento', '#ff9ad8', 5]]) {
        if (t <= 0) continue;
        x.textAlign = 'center'; x.textBaseline = 'alphabetic'; x.fillStyle = col; x.font = `700 ${2 * U}px system-ui, sans-serif`; x.fillText(name, W / 2, by - 1.2 * U);
        x.fillStyle = 'rgba(255,255,255,0.15)'; x.fillRect(W / 2 - 12 * U, by, 24 * U, 0.9 * U);
        x.fillStyle = col; x.fillRect(W / 2 - 12 * U, by, 24 * U * t / tot, 0.9 * U); by -= 5 * U;
      }
    } else {
      x.fillStyle = 'rgba(2,3,16,0.55)'; x.fillRect(0, 0, W, H);
      const pulse = 0.65 + 0.35 * Math.sin(T * 3);
      if (state === 'menu') {
        const g = x.createLinearGradient(0, H * 0.25, 0, H * 0.42); g.addColorStop(0, '#fff2b0'); g.addColorStop(1, '#ff9ad8');
        glowText('Lluvia de', W / 2, H * 0.28, Math.min(9 * U, W * 0.16), g, '#ffb347');
        glowText('Estrellas', W / 2, H * 0.28 + Math.min(10 * U, W * 0.18), Math.min(9 * U, W * 0.16), g, '#ffb347');
        glowText('Atrapa las estrellas  ·  esquiva los meteoritos', W / 2, H * 0.52, Math.min(2.6 * U, W * 0.045), '#cfe6ff', '#6fa8ff');
        x.globalAlpha = pulse; glowText('Toca para empezar', W / 2, H * 0.66, 4 * U, '#fff', '#8fb8ff'); x.globalAlpha = 1;
        glowText(best ? 'Récord: ' + best : 'Arrastra el dedo para mover tu cometa', W / 2, H * 0.74, 2.8 * U, '#ffe27a', '#ffb347');
      } else {
        glowText('¡Fin del juego!', W / 2, H * 0.3, Math.min(7 * U, W * 0.12), '#ff9ad8', '#ff3d8e');
        glowText(String(score), W / 2, H * 0.43, 12 * U, '#fff', '#8fb8ff');
        glowText('puntos', W / 2, H * 0.5, 3 * U, '#cfe6ff', '#6fa8ff');
        glowText(newRecord ? '¡Nuevo récord! ★' : 'Récord: ' + best, W / 2, H * 0.58, 4 * U, '#ffe27a', '#ffb347');
        if (overT > 0.7) { x.globalAlpha = pulse; glowText('Toca para jugar otra vez', W / 2, H * 0.7, 3.6 * U, '#fff', '#8fb8ff'); x.globalAlpha = 1; }
      }
    }
  }

  /* ---------- Bucle ---------- */
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05); last = now; T += dt;
    update(dt);
    x.setTransform(1, 0, 0, 1, 0, 0); x.globalAlpha = 1; x.globalCompositeOperation = 'source-over';
    x.drawImage(bgC, 0, 0);
    x.save();
    if (shake > 0) x.translate((Math.random() - 0.5) * shake * 3 * U, (Math.random() - 0.5) * shake * 3 * U);
    drawScene();
    x.restore();
    bloom();
    if (slowT > 0) { x.fillStyle = 'rgba(255,120,200,0.06)'; x.fillRect(0, 0, W, H); }
    if (flash > 0) { x.fillStyle = `rgba(255,40,80,${flash * 0.35})`; x.fillRect(0, 0, W, H); }
    const vg = x.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,12,0.55)'); x.fillStyle = vg; x.fillRect(0, 0, W, H);
    drawHUD();
    requestAnimationFrame(frame);
  }

  /* ---------- Entrada y arranque ---------- */
  function setP(e) { const k = e.pointerType === 'touch' ? 7 * U : 0; tgx = e.clientX * DPR; tgy = e.clientY * DPR - k; }
  addEventListener('pointermove', setP);
  addEventListener('pointerdown', e => {
    setP(e); initAudio();
    if (state === 'menu' || (state === 'over' && overT > 0.7)) startGame();
  });
  addEventListener('contextmenu', e => e.preventDefault());

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 1.5);
    W = c.width = Math.floor(innerWidth * DPR); H = c.height = Math.floor(innerHeight * DPR);
    U = Math.min(W, H) * 0.01; pl.r = 2.2 * U; pl.x = tgx = W / 2; pl.y = tgy = H * 0.8; trail = [];
    bgC = mk(W, H); const g = bgC.getContext('2d');
    const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#0b0a2e'); gr.addColorStop(0.55, '#07061c'); gr.addColorStop(1, '#02020a');
    g.fillStyle = gr; g.fillRect(0, 0, W, H); g.globalCompositeOperation = 'lighter';
    for (const [fx, fy, rr, col] of [[0.2, 0.25, 0.6, [90, 40, 170]], [0.85, 0.6, 0.6, [20, 90, 170]], [0.4, 0.95, 0.7, [150, 40, 120]]]) {
      const R = Math.max(W, H) * rr, q = g.createRadialGradient(W * fx, H * fy, 0, W * fx, H * fy, R);
      q.addColorStop(0, `rgba(${col[0]},${col[1]},${col[2]},0.22)`); q.addColorStop(1, `rgba(${col[0]},${col[1]},${col[2]},0)`);
      g.fillStyle = q; g.fillRect(0, 0, W, H);
    }
    b1 = mk(W / 4, H / 4); b1c = b1.getContext('2d'); b2 = mk(W / 12, H / 12); b2c = b2.getContext('2d');
    bgStars = Array.from({ length: Math.floor(W * H / 4500) }, () => ({ x: rnd(0, W), y: rnd(0, H), z: Math.random(), s: (0.6 + Math.random() * 1.6) * DPR, tw: rnd(0.6, 2.4), ph: rnd(0, 6.28), warm: Math.random() < 0.25 }));
  }
  addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
